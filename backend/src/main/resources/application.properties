spring.application.name=wbs

google.client-id=${GOOGLE_CLIENT_ID:554760889743-3bnkj20u6uee9g37nnguvpnu1th5s7on.apps.googleusercontent.com}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whiteboard_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}